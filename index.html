<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=index.html, initial-scale=1.0">
    <title>香港户外商店搜索 · 在线免代版</title>
    <!-- 引入简洁现代的 CSS 样式库 -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { padding: 20px; max-width: 900px; margin: 0 auto; }
        .store-card { padding: 15px; margin-bottom: 12px; border: 1px solid #e0e0e0; border-radius: 8px; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; margin-left: 10px; }
        .status-loading { background: #ffe0b2; color: #b78103; }
        .status-success { background: #c8e6c9; color: #256029; }
        .status-fail { background: #ffcdd2; color: #c63737; }
        .status-unknown { background: #e0e0e0; color: #616161; }
        .hidden { display: none; }
        details summary { cursor: pointer; user-select: none; font-weight: bold; color: #1072b4; }
    </style>
</head>
<body>

    <header>
        <h1>香港户外商店搜索</h1>
        <p>输入商品关键词，云端自动筛选含相关商品的商店（无须本地代理，随时随地可用）</p>
    </header>

    <main>
        <!-- 搜索控制区 -->
        <div class="grid">
            <input type="text" id="kwInput" placeholder="输入关键词（例如：Coulee）" value="Coulee">
            <button id="searchBtn" onclick="startSearch()">🔍 立即搜索</button>
        </div>

        <!-- 主搜索结果 -->
        <section>
            <h3>搜索结果</h3>
            <div id="mainResults">
                <p style="color: #666;">输入关键词并点击搜索开始检测...</p>
            </div>
        </section>

        <!-- 折叠区（未能自动确认或失败的商店） -->
        <section id="unknownSection" class="hidden">
            <details id="unknownDetails">
                <summary>未能自动确认/拦截的商店 (<span id="unknownCount">0</span>) <span>展开/收起</span></summary>
                <div id="unknownResults" style="margin-top: 15px;"></div>
            </details>
        </section>
    </main>

    <script>
        // 14 家香港户外商店的原始数据配置
        const STORES_CONFIG = [
            { name: "Campzone 预置", url: "https://campzoneoutdoor.com{kw}", desc: "露营用品专门店（Shopline）" },
            { name: "豪华 预置", url: "https://howa.com.hk{kw}", desc: "旺角实体店 · 露营/水上/旅游用品" },
            { name: "Overlander 预置", url: "https://overlander.com.hk{kw}", desc: "香港最大户外连锁" },
            { name: "Funshop", url: "https://funshopoutdoor.com.hk{kw}", desc: "露营装备店" },
            { name: "自然乐", url: "https://campingshare.com.hk{kw}", desc: "户外用品分享" },
            { name: "Wildholics", url: "https://wildholics.com{kw}", desc: "潮流户外" },
            { name: "速野", url: "https://yuenyewh.com{kw}", desc: "山系装备" },
            { name: "山川", url: "https://hillrilloutdoor.com{kw}", desc: "行山露营" },
            { name: "BackNature", url: "https://backnature.hk{kw}&options%5Bprefix%5D=last", desc: "背靠自然户外店" },
            { name: "小网店", url: "https://backpackhk.com{kw}&options%5Bprefix%5D=last", desc: "背包专门店" },
            { name: "Ultra Hing", url: "https://ultra-hing.com{kw}&options%5Bprefix%5D=last", desc: "专业户外装备" },
            { name: "ACTION", url: "https://actioncampinghk.com{kw}", desc: "ACTION 露营用品" },
            { name: "PlayHard", url: "https://playhardhk.com{kw}", desc: "选物店" },
            { name: "永高行", url: "https://supremeco.com.hk{kw}", desc: "战术与户外装备" }
        ];

        // 核心修改：使用免费、免注册的全球 CORS 云端代理中转
        // 它会代替你的浏览器去请求香港网站，从而彻底绕过本地网络拦截和跨域问题
        const CLOUD_PROXY = "https://allorigins.win";

        async function startSearch() {
            const kw = document.getElementById('kwInput').value.trim();
            if (!kw) {
                alert('请输入关键词！');
                return;
            }

            // 初始化界面
            const mainResults = document.getElementById('mainResults');
            const unknownResults = document.getElementById('unknownResults');
            const unknownSection = document.getElementById('unknownSection');
            const unknownCount = document.getElementById('unknownCount');
            
            mainResults.innerHTML = '';
            unknownResults.innerHTML = '';
            unknownSection.classList.remove('hidden');
            
            let unknownTotal = 0;
            unknownCount.innerText = unknownTotal;

            // 循环异步并发检测每家商店
            STORES_CONFIG.forEach(async (store) => {
                const targetUrl = store.url.replace('{kw}', encodeURIComponent(kw));
                
                // 创建该商店的 DOM 节点
                const card = document.createElement('div');
                card.className = 'store-card';
                card.innerHTML = `
                    <strong>${store.name}</strong> <small style="color:#777;">${store.desc || ''}</small>
                    <span class="status-badge status-loading" id="badge-${store.name}">正在检测...</span>
                    <div style="margin-top:5px; font-size:0.9em;">
                        <a href="${targetUrl}" target="_blank">🔗 打开原网搜索页</a>
                    </div>
                    <div id="info-${store.name}" style="margin-top:5px; font-size:0.85em; color:#555;"></div>
                `;
                
                // 默认放入主结果区，等待检测
                mainResults.appendChild(card);
                const badge = card.querySelector(`#badge-${store.name}`);
                const infoDiv = card.querySelector(`#info-${store.name}`);

                try {
                    // 关键改动：拼接云端代理地址，发起请求
                    const response = await fetch(CLOUD_PROXY + encodeURIComponent(targetUrl));
                    
                    if (!response.ok) throw new Error('网络请求未响应');
                    
                    const htmlText = await response.text();

                    // 简易的“无结果”关键词碰撞逻辑（可根据实际情况在下方加入更多关键词）
                    const noResultKeywords = ["未找到", "没有找到", "找不到", "0个结果", "0 products", "No products Found", "找不到相关商品"];
                    const hasNoResult = noResultKeywords.some(key => htmlText.includes(key));

                    if (hasNoResult) {
                        // 明确没有商品的商店，直接过滤移出，或者塞进折叠区
                        badge.className = "status-badge status-fail";
                        badge.innerText = "无商品 (已自动过滤)";
                        moveStoreToUnknown(card);
                    } else {
                        // 判定可能含有商品
                        badge.className = "status-badge status-success";
                        badge.innerText = "检测到商品 / 推荐查看";
                        infoDiv.innerHTML = `<span style="color:green;">✨ 页面数据已加载，建议点击上方链接查看！</span>`;
                    }

                } catch (error) {
                    // 如果云端请求也失败了（如目标网站彻底拦截了该代理），做降级容灾处理
                    badge.className = "status-badge status-unknown";
                    badge.innerText = "需手动确认";
                    infoDiv.innerHTML = `<span style="color:#777;">提示：由于站点反爬或动态加载，请点击上方链接手动查看结果。</span>`;
                    moveStoreToUnknown(card);
                }
            });

            // 将卡片移动到下方折叠区的辅助函数
            function moveStoreToUnknown(cardElement) {
                unknownResults.appendChild(cardElement);
                unknownTotal++;
                unknownCount.innerText = unknownTotal;
            }
        }
    </script>
</body>
</html>
